[project]
name = "sonicfetch-desktop"
version = "0.1.0"
description = "SonicFetch Desktop (Windows) - Extrator de áudio de máxima fidelidade para UVR5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
